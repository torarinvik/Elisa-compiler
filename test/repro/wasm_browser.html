<!doctype html>
<meta charset="utf-8">
<title>Elisa WASM browser smoke</title>
<link rel="icon" href="data:,">
<main id="result">loading</main>
<script type="module">
  const moduleUrl = new URLSearchParams(location.search).get("module") ?? "/build/wasm-browser/elisa-demo.mjs";
  const loadWasm = (await import(moduleUrl)).default;
  const wasm = await loadWasm();
  const text = wasm.wasm_echo_text("Hello from Elisa 🌍");
  const sum = wasm.add_wasm(20, 22);
  const buffer = wasm.writeBytes(Uint8Array.of(8, 13, 21));
  const bytes = wasm.readBytes(buffer.pointer, buffer.length).join(",");
  wasm.free(buffer.pointer);
  document.querySelector("#result").textContent = `${text} · ${sum} · ${bytes}`;
</script>
