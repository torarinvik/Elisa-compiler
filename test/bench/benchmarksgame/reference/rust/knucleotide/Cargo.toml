[package]
name = "knucleotide"
version = "0.0.0"
edition = "2015"
publish = false

[[bin]]
name = "knucleotide"
path = "src/main.rs"

[dependencies]
futures = "=0.1.31"
tokio-threadpool = "=0.1.18"
itertools = "=0.13.0"
num = "=0.4.3"
hashbrown = "=0.15.2"

[profile.release]
opt-level = 3
codegen-units = 1
lto = false
debug = false
