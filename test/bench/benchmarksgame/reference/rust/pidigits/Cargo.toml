[package]
name = "pidigits"
version = "0.0.0"
edition = "2015"
publish = false

[[bin]]
name = "pidigits"
path = "src/main.rs"

[dependencies]
rug = { version = "=1.26.1", default-features = false, features = ["integer"] }
gmp-mpfr-sys = { version = "=1.6.4", default-features = false, features = ["use-system-libs"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = false
debug = false
